
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

}
android {
    namespace 'com.dakotarp.launcher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dakotarp.launcher'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
